# Сборка фронтенда и публикация на GitHub Pages. Бэкенд не нужен: сайт работает в демо-режиме
# на данных из frontend/src/data (ARCHITECTURE.md, раздел 7.1).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Подпапка сайта на Pages: /<репозиторий>/ (или / для <user>.github.io)
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_USE_MOCKS: 'true'

      # Pages не знает о маршрутах SPA: на прямую ссылку вроде /map/kostanay он отдаёт 404.html,
      # поэтому 404.html — копия index.html, и маршрут открывает уже само приложение.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
