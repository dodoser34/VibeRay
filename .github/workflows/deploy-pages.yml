# Сборка фронтенда и публикация на GitHub Pages. Бэкенд не нужен: сайт работает в демо-режиме
# на данных из frontend/src/demo-data (ARCHITECTURE.md, раздел 7.1).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Подпапка сайта на Pages: /<репозиторий>/ (или / для <user>.github.io)
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_USE_MOCKS: 'true'
          # Адрес сайта для ссылок на переводы (hreflang) и sitemap.xml. Сборка сама кладёт страницу
          # на каждом языке (/en/about/index.html …) и 404.html — копию приложения для остальных
          # адресов SPA (plugins/languagePages.js).
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
